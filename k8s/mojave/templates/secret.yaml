apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mojave.fullname" . }}-auth
  labels: {{- include "mojave.labels" . | nindent 4 }}
type: Opaque
stringData:
  # All three must be set for sign-in to work. If any is empty the server
  # starts read-only, which is a valid state: the site serves, nobody stamps.
  github-client-id: {{ .Values.secrets.githubClientId | quote }}
  github-client-secret: {{ .Values.secrets.githubClientSecret | quote }}
  session-key: {{ .Values.secrets.sessionKey | quote }}

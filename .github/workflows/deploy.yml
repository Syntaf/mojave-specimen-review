name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go vet ./...
      - run: go test ./... -race

  deploy:
    needs: gate
    # Set repository variable DEPLOY_ENABLED=true once the secrets below exist.
    # Until then this job is skipped rather than failing on a missing token.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # DigitalOcean Container Registry rather than Docker Hub: same cloud as
      # the cluster, one credential, and the image can stay private.
      - name: Registry login
        run: doctl registry login --expiry-seconds 1200

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: registry.digitalocean.com/mbolt/mojave-specimen-review:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Fetch kubeconfig
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 1200 ${{ secrets.DO_CLUSTER_ID }}

      # Deploys into the `dnd` namespace on purpose: that is where the nginx
      # controller serving mbolt.app watches, and where the cert-manager Issuer
      # lives. See README.md "Why the dnd namespace".
      - name: Helm upgrade
        run: |
          helm upgrade --install mojave ./k8s/mojave \
            --namespace dnd \
            --atomic --timeout 5m \
            --set image.tag=${{ github.sha }} \
            --set secrets.githubClientId="${{ secrets.GH_OAUTH_CLIENT_ID }}" \
            --set secrets.githubClientSecret="${{ secrets.GH_OAUTH_CLIENT_SECRET }}" \
            --set secrets.sessionKey="${{ secrets.SESSION_KEY }}"
